[package]
name = "gametime"
version = "0.1.0"
edition = "2021"

[lib]
name = "gametime"
path = "src/lib.rs"

[[bin]]
name = "gametime"
path = "src/main.rs"

[[bin]]
name = "gametime-tracker"
path = "src/tracker_bin.rs"

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
