<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>GameTime</title>
<style>
/* ---- Theme tokens (dataviz reference palette). One block: light-dark(light, dark).
   Follows the OS by default; ?theme=dark|light (data-theme) overrides. ---- */
:root { color-scheme: light dark;
  --bg: light-dark(#f9f9f7, #0d0d0d); --panel: light-dark(#fcfcfb, #1a1a19);
  --text: light-dark(#0b0b0b, #f0efec); --text2: light-dark(#52514e, #c3c2b7); --muted: #898781;
  --line: light-dark(#e1e0d9, #2c2c2a); --axis: light-dark(#c3c2b7, #383835);
  --accent: light-dark(#2a78d6, #3987e5);            /* rings, borders (non-text) */
  --accent-fill: light-dark(#256abf, #1c5cab); --onaccent: #ffffff; /* filled controls with text, >= 4.5:1 */
  --bad: light-dark(#d03b3b, #e66767); --good: light-dark(#006300, #0ca30c);
  --shadow: light-dark(rgba(11, 11, 11, 0.18), rgba(0, 0, 0, 0.6));
  /* categorical slots (by all-time rank): blue, orange, aqua, yellow, magenta, green, violet, red;
     --cfN is the label ink for slot N, chosen per theme for >= 4.5:1 (checked by the self-test) */
  --c0: light-dark(#2a78d6, #3987e5); --c1: light-dark(#eb6834, #d95926); --c2: light-dark(#1baf7a, #199e70); --c3: light-dark(#eda100, #c98500);
  --c4: light-dark(#e87ba4, #d55181); --c5: #008300; --c6: light-dark(#6250d6, #9085e9); --c7: light-dark(#e34948, #e66767);
  --cf0: light-dark(#000000, #0b0b0b); --cf1: #0b0b0b; --cf2: #0b0b0b; --cf3: #0b0b0b; --cf4: #0b0b0b;
  --cf5: #ffffff; --cf6: light-dark(#ffffff, #0b0b0b); --cf7: #0b0b0b;
  --other: light-dark(#b5b4ab, #5a5953); --cfo: light-dark(#0b0b0b, #ffffff);
  /* sequential (blue, one hue; light = more in dark mode) and the ink on each step */
  --s0: light-dark(#f1f0ec, #242422); --s1: light-dark(#b7d3f6, #0d366b); --s2: light-dark(#86b6ef, #184f95); --s3: light-dark(#5598e7, #1c5cab);
  --s4: light-dark(#3987e5, #256abf); --s5: light-dark(#256abf, #3987e5); --s6: light-dark(#184f95, #6da7ec); --s7: light-dark(#0d366b, #9ec5f4);
  --sf0: light-dark(#52514e, #c3c2b7); --sf1: light-dark(#0b0b0b, #ffffff); --sf2: light-dark(#0b0b0b, #ffffff);
  --sf3: light-dark(#0b0b0b, #ffffff); --sf4: light-dark(#0b0b0b, #ffffff); --sf5: light-dark(#ffffff, #0b0b0b);
  --sf6: light-dark(#ffffff, #0b0b0b); --sf7: light-dark(#ffffff, #0b0b0b);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
.oldnote { display: none; font-size: 12px; color: var(--text2); }
/* Browsers without light-dark() (before 2024): the tokens above are invalid there, so restate them with the
   light values. Kept identical to the light half of each light-dark() pair (checked by the self-test). */
@supports not (color: light-dark(#000, #fff)) {
:root { color-scheme: light;
  --bg: #f9f9f7; --panel: #fcfcfb;
  --text: #0b0b0b; --text2: #52514e; --muted: #898781;
  --line: #e1e0d9; --axis: #c3c2b7;
  --accent: #2a78d6;            /* rings, borders (non-text) */
  --accent-fill: #256abf; --onaccent: #ffffff; /* filled controls with text, >= 4.5:1 */
  --bad: #d03b3b; --good: #006300;
  --shadow: rgba(11, 11, 11, 0.18);
  --c0: #2a78d6; --c1: #eb6834; --c2: #1baf7a; --c3: #eda100;
  --c4: #e87ba4; --c5: #008300; --c6: #6250d6; --c7: #e34948;
  --cf0: #000000; --cf1: #0b0b0b; --cf2: #0b0b0b; --cf3: #0b0b0b; --cf4: #0b0b0b;
  --cf5: #ffffff; --cf6: #ffffff; --cf7: #0b0b0b;
  --other: #b5b4ab; --cfo: #0b0b0b;
  --s0: #f1f0ec; --s1: #b7d3f6; --s2: #86b6ef; --s3: #5598e7;
  --s4: #3987e5; --s5: #256abf; --s6: #184f95; --s7: #0d366b;
  --sf0: #52514e; --sf1: #0b0b0b; --sf2: #0b0b0b;
  --sf3: #0b0b0b; --sf4: #0b0b0b; --sf5: #ffffff;
  --sf6: #ffffff; --sf7: #ffffff;
}
:root[data-theme] { color-scheme: light; }
.oldnote { display: block; }
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 16px; }
header.top { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0; font-weight: 600; }
.meta { color: var(--text2); font-size: 13px; }
button, input[type=text] { font: inherit; color: var(--text); background: var(--panel);
       border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.4; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text] { width: min(420px, 100%); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
section.panel { margin-top: 14px; }
.phead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; margin-bottom: 10px; }

/* controls: one row above the charts */
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0; min-height: 34px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--onaccent); }
.nav { display: inline-flex; gap: 6px; align-items: center; }
#period { min-width: 9.5em; text-align: center; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--accent); border-radius: 14px; padding: 2px 4px 2px 10px; font-size: 13px; }
.chip button { border: 0; background: none; padding: 0 6px; font-size: 16px; line-height: 1; }
.live { font-size: 13px; font-weight: 600; }
.live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
[hidden] { display: none !important; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { text-align: left; min-height: 66px; }
.tile .label { color: var(--text2); font-size: 12px; }
.tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
button.tile:hover { border-color: var(--accent); }

/* month calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { font-size: 12px; color: var(--text2); text-align: center; padding-bottom: 2px; }
.day { position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch;
       min-height: 68px; padding: 4px 5px 5px; text-align: left; border: 1px solid var(--line); border-radius: 6px;
       background: var(--s0); color: var(--sf0); overflow: hidden; }
.day.b1 { background: var(--s1); color: var(--sf1); } .day.b2 { background: var(--s2); color: var(--sf2); }
.day.b3 { background: var(--s3); color: var(--sf3); } .day.b4 { background: var(--s4); color: var(--sf4); }
.day.b5 { background: var(--s5); color: var(--sf5); } .day.b6 { background: var(--s6); color: var(--sf6); }
.day.b7 { background: var(--s7); color: var(--sf7); }
.day.out { border-style: dashed; border-color: var(--axis); } /* full-contrast ink; the dashed edge marks the adjacent month */
.day.sel { box-shadow: inset 0 0 0 2px var(--text); }
.dn { font-size: 12px; font-weight: 600; align-self: flex-start; min-width: 1.6em; text-align: center; border-radius: 10px; }
.day.today .dn { background: var(--accent-fill); color: var(--onaccent); padding: 0 4px; }
.dt { font-size: 12px; font-weight: 600; margin: 2px 0; white-space: nowrap; }
.bar { display: flex; gap: 2px; height: 7px; background: var(--panel); border-radius: 4px; padding: 1px; min-height: 7px; }
.bar i { display: block; height: 100%; min-width: 2px; border-radius: 2px; }
.bar.empty { visibility: hidden; }
.ldot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--panel); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.lchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; font-size: 12px; border-radius: 12px; }
.lchip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
td .sw { margin-right: 6px; }
#dayTitle:focus { outline: none; }
.bar i.rest, .sw.rest { background-image: repeating-linear-gradient(135deg, var(--panel) 0 2px, transparent 2px 5px); }
.lnote { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); padding: 2px 4px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }

/* day timeline */
.axis { position: relative; height: 50px; margin: 6px 0 22px; background: var(--s0); border-radius: 6px; border: 1px solid var(--line); }
.tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.tick span { position: absolute; top: 100%; margin-top: 3px; transform: translateX(-50%); font-size: 11px; color: var(--text2); }
.tick.first span { transform: none; } .tick.lastt span { transform: translateX(-100%); }
.blk { position: absolute; top: 5px; bottom: 5px; min-width: 4px; padding: 0 5px; border: 0; border-radius: 4px;
       box-shadow: 0 0 0 1px var(--panel); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; font-weight: 600; text-align: left; }
.blk.open { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--panel) 28%, transparent) 0 4px, transparent 4px 9px);
            outline: 2px dashed var(--text); outline-offset: -2px; }
.blk:hover, .blk:focus-visible { filter: brightness(1.12); }
.blk:focus-visible, .blk.open:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; box-shadow: 0 0 0 2px var(--panel); z-index: 2; }
.seg button:focus-visible { position: relative; z-index: 1; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 8px; border: 1px solid var(--bad); color: var(--bad); margin-left: 6px; }

/* tables */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--text2); font-weight: 600; font-size: 12px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

/* year heatmap */
.scroll { overflow-x: auto; }
#heat svg { display: block; width: 100%; min-width: 640px; height: auto; }
.hc { stroke: none; cursor: pointer; }
.hc.b0 { fill: var(--s0); } .hc.b1 { fill: var(--s1); } .hc.b2 { fill: var(--s2); } .hc.b3 { fill: var(--s3); }
.hc.b4 { fill: var(--s4); } .hc.b5 { fill: var(--s5); } .hc.b6 { fill: var(--s6); } .hc.b7 { fill: var(--s7); }
.hc.today { stroke: var(--accent); stroke-width: 2; } .hc.sel { stroke: var(--text); stroke-width: 2; }
.hc:hover { stroke: var(--text2); stroke-width: 1.5; }
#heat text { fill: var(--text2); font-size: 10px; }
.hleg { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--text2); }
.hleg i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
.hleg i.b0 { background: var(--s0); } .hleg i.b1 { background: var(--s1); } .hleg i.b2 { background: var(--s2); } .hleg i.b3 { background: var(--s3); }
.hleg i.b4 { background: var(--s4); } .hleg i.b5 { background: var(--s5); } .hleg i.b6 { background: var(--s6); } .hleg i.b7 { background: var(--s7); }

/* per-game totals */
.grow { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr) auto; grid-template-areas: "name bar val" "meta meta meta";
        gap: 2px 12px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 7px 4px; background: none; }
.grow:hover:not(:disabled) { background: var(--s0); border-color: var(--line); }
.grow[aria-pressed="true"] { background: var(--s0); box-shadow: inset 3px 0 0 var(--accent); }
.grow.dim { opacity: 0.5; }
.gname { grid-area: name; display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; }
.gname span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gbar { grid-area: bar; height: 8px; }
.gbar i { display: block; height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; }
.gval { grid-area: val; font-variant-numeric: tabular-nums; font-weight: 600; }
.gmeta { grid-area: meta; font-size: 12px; color: var(--text2); padding-left: 16px; }
.more { margin-top: 8px; }
.empty-note { color: var(--text2); padding: 14px 4px; }

/* tooltip */
#tip { position: fixed; z-index: 10; pointer-events: none; max-width: 260px; padding: 6px 9px; font-size: 12px; line-height: 1.35;
       background: var(--panel); color: var(--text); border: 1px solid var(--axis); border-radius: 6px; box-shadow: 0 4px 14px var(--shadow); white-space: pre-line; }
#tip .tt { font-weight: 700; font-size: 13px; }

/* loader / errors / selftest */
#loader { margin: 12px 0; display: none; }
#loader.open { display: block; }
#drop { margin-top: 10px; border: 2px dashed var(--line); border-radius: 8px; padding: 22px; text-align: center; color: var(--text2); }
#drop.over { border-color: var(--accent); color: var(--text); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
#error { display: none; color: var(--bad); margin: 10px 0; white-space: pre-wrap; }
#skipped { color: var(--bad); }
.pass { color: var(--good); } .fail { color: var(--bad); font-weight: 600; }
#selftest { display: none; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
#selftest div { padding: 2px 0; }

@media (max-width: 560px) {
  main { padding: 10px; }
  .cal { gap: 2px; }
  .day { min-height: 54px; padding: 3px; }
  .dt { font-size: 10px; } .dn { font-size: 11px; }
  .grow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name val" "bar bar" "meta meta"; }
  .gmeta { padding-left: 0; }
  #period { min-width: 0; }
}
@media (forced-colors: active) {
  .day, .blk, .grow[aria-pressed="true"] { border: 1px solid CanvasText; }
  .hc { stroke: CanvasText; stroke-width: 0.5; }
}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>GameTime</h1>
    <div class="meta"><span id="srcinfo">no data loaded</span><span id="skipped"></span>
      <button id="loadbtn" type="button">Load…</button></div>
  </header>
  <div class="meta" id="generated"></div>
  <div class="oldnote">This browser is too old for dark mode; showing the light theme.</div>

  <section id="loader" class="panel">
    <div>Choose a data source (<code>sessions.json</code>).</div>
    <div class="row">
      <input type="text" id="url" placeholder="http://game-pc:8080/sessions.json" aria-label="sessions.json URL">
      <button id="urlbtn" type="button">Load URL</button>
    </div>
    <div id="drop">Drop a sessions.json here or
      <button id="pick" type="button">choose a file</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </section>
  <div id="error" role="alert"></div>

  <div id="app" style="display:none">
    <div class="controls">
      <div class="seg" role="group" aria-label="Range" id="rangeSeg">
        <button type="button" data-range="week" aria-pressed="false">Week</button>
        <button type="button" data-range="month" aria-pressed="true">Month</button>
        <button type="button" data-range="year" aria-pressed="false">Year</button>
        <button type="button" data-range="all" aria-pressed="false">All</button>
      </div>
      <div class="nav">
        <button type="button" id="prev" aria-label="Previous period">&#8249;</button>
        <span id="period" aria-live="polite"></span>
        <button type="button" id="next" aria-label="Next period">&#8250;</button>
        <button type="button" id="today">Today</button>
      </div>
      <div class="chip" id="filter" hidden><span id="filterName"></span>
        <button type="button" id="clearFilter" aria-label="Clear game filter">&times;</button></div>
      <span class="live" id="live" hidden></span>
    </div>

    <div class="tiles" id="tiles" data-host></div>

    <section class="panel" aria-labelledby="monthTitle">
      <div class="phead"><h2 id="monthTitle"></h2><span class="meta">Click a day for its timeline</span></div>
      <div id="month" data-host></div>
      <div class="legend" id="legend" data-host></div>
    </section>

    <section class="panel" id="dayPanel" aria-labelledby="dayTitle" hidden>
      <div class="phead"><h2 id="dayTitle" tabindex="-1"></h2>
        <span><span class="meta" id="dayMeta"></span> <button type="button" id="dayClose" aria-label="Close day timeline">&times; Close</button></span></div>
      <div id="dayBody" data-host></div>
    </section>

    <section class="panel" aria-labelledby="heatTitle">
      <div class="phead"><h2 id="heatTitle"></h2><span class="meta">Weeks start on Monday</span></div>
      <div class="scroll"><div id="heat" data-host></div></div>
      <div class="hleg" id="heatLegend"></div>
    </section>

    <section class="panel" aria-labelledby="totalsTitle">
      <div class="phead"><h2 id="totalsTitle"></h2><span class="meta">Click a game to filter everything</span></div>
      <div id="totals" data-host></div>
    </section>
  </div>
  <div id="tip" role="tooltip" hidden></div>
  <div id="selftest" class="panel"></div>
</main>

<!-- ===================================================================
     Pure aggregation module: GT.agg. No DOM access, no globals besides GT.
     =================================================================== -->
<script>
"use strict";
var GT = {};
GT.agg = (function () {
  var DAY_MS = 86400000;
  // Number of categorical colour slots. Game colours are assigned by all-time
  // rank (see rankGames); the page maps slot N to the CSS variables --cN / --cfN.
  var COLOR_SLOTS = 8;

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  // ---- Time handling -------------------------------------------------
  // A time is {utcMs, offsetMin}: the absolute instant plus the UTC offset
  // written in the ISO string (the GAME PC's offset, e.g. 120 for +02:00).
  // Calendar days/hours are derived by shifting utcMs by offsetMin and then
  // reading the result with the getUTC* accessors. The browser's own time
  // zone is never consulted.
  var ISO_RE = /^(\d{4})-(\d\d)-(\d\d)[T ](\d\d):(\d\d):(\d\d)(?:\.\d+)?(Z|[+-]\d\d:?\d\d)$/i;

  // Like Date.UTC but years 0-99 are not mapped to 1900-1999.
  function utcMs(y, mo, d, h, mi, s) {
    var dt = new Date(0);
    dt.setUTCFullYear(y, mo - 1, d);
    dt.setUTCHours(h, mi, s, 0);
    return dt.getTime();
  }

  function parseTime(str) {
    if (typeof str !== "string") return null;
    var m = ISO_RE.exec(str);
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3], h = +m[4], mi = +m[5], s = +m[6];
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || mi > 59 || s > 59) return null;
    var offsetMin = 0;
    if (m[7].toUpperCase() !== "Z") {
      var sign = m[7][0] === "-" ? -1 : 1;
      var digits = m[7].slice(1).replace(":", "");
      var oh = +digits.slice(0, 2), om = +digits.slice(2);
      if (oh > 14 || om > 59) return null;
      offsetMin = sign * (oh * 60 + om);
    }
    // Treat the wall-clock fields as UTC; subtracting the offset gives the true instant.
    var wallAsUtc = utcMs(y, mo, d, h, mi, s);
    if (new Date(wallAsUtc).getUTCDate() !== d) return null; // e.g. Feb 31 rolled over
    return { utcMs: wallAsUtc - offsetMin * 60000, offsetMin: offsetMin };
  }

  // Local wall-clock milliseconds (as if the local time were UTC).
  function localMs(utcMs, offsetMin) { return utcMs + offsetMin * 60000; }

  function pad4(n) { return (n < 10 ? "000" : n < 100 ? "00" : n < 1000 ? "0" : "") + n; }

  function dayKeyFromLocalMs(lms) {
    var d = new Date(lms);
    return pad4(d.getUTCFullYear()) + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
  }
  function localDay(t) { return dayKeyFromLocalMs(localMs(t.utcMs, t.offsetMin)); }
  function localHour(t) { return new Date(localMs(t.utcMs, t.offsetMin)).getUTCHours(); }
  function localMinute(t) { return new Date(localMs(t.utcMs, t.offsetMin)).getUTCMinutes(); }

  function keyToLocalMs(key) { // 'YYYY-MM-DD' -> 00:00 of that day in "local-as-UTC" space
    return utcMs(+key.slice(0, 4), +key.slice(5, 7), +key.slice(8, 10), 0, 0, 0);
  }

  // ---- Validation ----------------------------------------------------
  // Returns a normalized session or null if invalid.
  function validateSession(raw) {

  function rememberSource(url) { try { localStorage.setItem(LS_KEY, url); } catch (e) { /* storage unavailable */ } }
  function savedSource() { try { return localStorage.getItem(LS_KEY); } catch (e) { return null; } }

  function loadFromUrl(url, remember) {
    showError("");
    return fetchSource(url).then(function (data) {

      $("url").value = url;
      safeShow(data, url);
    }, function (err) { showError(err.message); $("loader").classList.add("open"); });
  }

  function loadFromFile(file) {
    showError("");
    var r = new FileReader();
    r.onload = function () {
      var data;
      try { data = loadText(file.name, r.result); } catch (e) { showError(e.message); return; }
      safeShow(data, "file: " + file.name);
    };
    r.onerror = function () { showError("Could not read " + file.name + "."); };
    r.readAsText(file);
  }

  // Priority: ?src=  ->  same-origin ./sessions.json (http/https only)  ->  remembered URL  ->  drop zone.
  function start() {

    var base = new URL("./sessions.json", location.href).href;
    return fetchSource(base).then(function (data) { safeShow(data, base); }, function (err) {
      if (err.fallthrough) return fallback(); // unreachable or 404: not served by a tracker, try the next source
      showError(err.message); // 5xx, bad JSON, unsupported version...: tell the user
      $("loader").classList.add("open");
    });
  }

  // ---- State ------------------------------------------------------------
  // pieces: all day pieces; rank: game -> all-time rank (colours); fp: pieces after the game filter;
  // dayMap: byDay(fp); maxDay: busiest day of the displayed year (shading scale, set in render()).
  var state = null;

  // Colours come from the all-time rank (state.rank): top 8 games get slots, the rest "other".
  function colorVar(name) { var n = A.colorSlot(state.rank, name); return n < 0 ? "var(--other)" : "var(--c" + n + ")"; }
  function inkVar(name) { var n = A.colorSlot(state.rank, name); return n < 0 ? "var(--cfo)" : "var(--cf" + n + ")"; }
  function swatch(name) { var s = el("span", { className: "sw" }); s.style.background = colorVar(name); return s; }

  function fmtDay(k) { return DOW[A.weekdayIndex(k)] + ", " + MON3[+k.slice(5, 7) - 1] + " " + (+k.slice(8)) + ", " + k.slice(0, 4); }
  function fmtShort(k) { return MON3[+k.slice(5, 7) - 1] + " " + (+k.slice(8)); }
  function fmtOffset(min) { return A.offsetLabel([min]); }
  function periodLabel(range, rng) {
    if (range === "all") return "All time";
    if (range === "week") return fmtShort(rng.from) + " – " + fmtShort(rng.to) + ", " + rng.to.slice(0, 4);
    if (range === "month") return MONTHS[+rng.from.slice(5, 7) - 1] + " " + rng.from.slice(0, 4);
    return rng.from.slice(0, 4);
  }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

  function show(data, label) {

    var refDay;

    else if (pieces.length) refDay = pieces.reduce(function (mx, p) { return p.day > mx ? p.day : mx; }, "0000-00-00");

              game: null, selDay: null, opener: null, showAll: false, fp: pieces, dayMap: null, maxDay: 0,
              rank: A.rankGames(pieces), genClock: data.generated ? A.clock(data.generated.utcMs, data.generated.offsetMin) : "" };
    // Optional deep links: ?day=YYYY-MM-DD opens that day's timeline, ?range=week|month|year|all.

    if (qr && ["week", "month", "year", "all"].indexOf(qr) >= 0) state.range = qr;
    showError("");
    $("app").style.display = "";
    $("loader").classList.remove("open");
    $("srcinfo").textContent = label + " · " + data.sessions.length + " sessions";
    $("skipped").textContent = data.skipped ? " · " + data.skipped + " skipped " : " ";
    $("generated").textContent = data.generated ? "Generated: " + refDay + " " + pad(A.localHour(data.generated)) + ":" +
      pad(A.localMinute(data.generated)) + " (game PC time, " + fmtOffset(data.generated.offsetMin) + ")" : "";
    applyFilter();
    render();
    document.documentElement.setAttribute("data-render-ms", String(Math.round(performance.now() - t0)));
  }

  function applyFilter() {
    var g = state.game;

    state.dayMap = A.byDay(state.fp);

  // Re-render everything, keeping keyboard focus on the same logical control.
  function rerender() {

  // ---- Controls ---------------------------------------------------------

    $("prev").disabled = $("next").disabled = state.range === "all";
    $("filter").hidden = !state.game;
    $("filterName").textContent = state.game ? "Game: " + state.game : "";
    var live = $("live");
    if (state.open.length) { live.hidden = false; live.textContent = "Playing now: " + state.open[state.open.length - 1].game + (state.genClock ? " · as of " + state.genClock : ""); }
    else live.hidden = true;
  }

  function shiftAnchor(dir) {

  // ---- Summary tiles ------------------------------------------------------
  function renderSummary(s) {
    var t = $("tiles"); t.textContent = "";
    [["Total time", A.formatDuration(s.total_s), null], ["Days played", String(s.days_played), null],

      .forEach(function (x) {

        var tile = el(x[2] ? "button" : "div", { className: "panel tile" }, kids);

      });

  // ---- Month calendar -----------------------------------------------------
  function dayGames(e) { return Array.from(e.perGame).sort(function (a, b) { return b[1] - a[1] || (a[0] < b[0] ? -1 : 1); }); }

  function dayLabel(k, e, live) {

    else s += ": " + A.formatDuration(e.total_s) + " (" + dayGames(e).slice(0, 4).map(function (g) { return g[0] + " " + A.formatDuration(g[1]); }).join(", ") + ")";
    return live ? s + ", playing now" : s;
  }
  function dayTip(k, e, live) {

      if (gs.length > 5) lines.push("+" + (gs.length - 5) + " more");

  function isLive(k) {

    return false;
  }

  function renderMonth() {
    var host = $("month"); host.textContent = "";
    var a = state.anchor, mk = a.slice(0, 7);
    $("monthTitle").textContent = MONTHS[+a.slice(5, 7) - 1] + " " + a.slice(0, 4);
    var grid = el("div", { className: "cal" });
    grid.setAttribute("role", "group"); grid.setAttribute("aria-label", "Month calendar");
    DOW.forEach(function (d) { grid.appendChild(el("div", { className: "dow", textContent: d })); });
    A.monthGrid(a).forEach(function (w) {
      w.forEach(function (k) {
        var e = state.dayMap.get(k), total = e ? e.total_s : 0, live = isLive(k);
        var b = A.bucket(total, state.maxDay, 7);
        var cell = el("button", { type: "button", className: "day b" + b + (k.slice(0, 7) !== mk ? " out" : "") + (k === state.refDay ? " today" : "") + (k === state.selDay ? " sel" : "") });
        cell.setAttribute("data-day", k);

        cell.appendChild(el("span", { className: "dt", textContent: total > 0 ? A.formatDuration(total) : "" }));
        var bar = el("span", { className: "bar" + (total > 0 ? "" : " empty") });
        if (total > 0) {

          gs.forEach(function (g, i) {

            else rest += g[1];
          });
          if (rest > 0) { var o = el("i", { className: "rest" }); o.style.flexGrow = String(rest); o.style.flexBasis = "0"; o.style.background = "var(--other)"; bar.appendChild(o); }
        }
        cell.appendChild(bar);
        if (live) cell.appendChild(el("span", { className: "ldot" }));
        grid.appendChild(cell);
      });
    });
    host.appendChild(grid);

    // Legend: games played this month (unfiltered), also a filter control.
    var lg = $("legend"); lg.textContent = "";
    var games = A.byGame(state.pieces, A.ranges(a).month);
    games.slice(0, 10).forEach(function (g) {
      var c = el("button", { type: "button", className: "lchip" }, [swatch(g.game), g.game]);
      c.setAttribute("data-game", g.game); c.setAttribute("aria-pressed", String(state.game === g.game));

    // Grey is used twice, so say so: solid = games ranked 9th+ overall, hatched = the smaller games of that day lumped together.
    var sw1 = el("i", { className: "sw" }); sw1.style.background = "var(--other)";
    var sw2 = el("i", { className: "sw rest" }); sw2.style.background = "var(--other)";
    lg.appendChild(el("span", { className: "lnote" }, [sw1, "Other games (9th+ overall)"]));
    lg.appendChild(el("span", { className: "lnote" }, [sw2, "Rest of the day (games after the top 3)"]));
  }

  // ---- Day timeline -------------------------------------------------------
  function renderDay() {
    var panel = $("dayPanel"), k = state.selDay;
    panel.hidden = !k;

    $("dayTitle").textContent = fmtDay(k);
    var ps = (state.byDayPieces.get(k) || []).filter(function (p) { return (p.active_s > 0 || p.open) && (!state.game || p.game === state.game); })
      .sort(function (a, b) { return a.startMs - b.startMs; });
    var total = 0; ps.forEach(function (p) { total += p.active_s; });
    $("dayMeta").textContent = ps.length ? A.formatDuration(total) + " active · times in game PC time (" + A.offsetLabel(A.pieceOffsets(ps)) + ")" +
      (state.game ? " · " + state.game + " only" : "") : "";
    if (!ps.length) { body.appendChild(el("div", { className: "empty-note", textContent: "No sessions on this day" + (state.game ? " for " + state.game : "") + "." })); return; }

    var axis = el("div", { className: "axis" });

      var desc = p.game + ", " + times + ", " + A.formatDuration(p.active_s) + " active" + (p.open ? ", playing now" : "");
      var b = el("div", { className: "blk" + (p.open ? " open" : ""), textContent: p.game, tabIndex: 0 });
      b.setAttribute("role", "img");
      b.style.left = "min(" + (sp.x0 * 100) + "%, calc(100% - 4px))"; b.style.width = ((sp.x1 - sp.x0) * 100) + "%";
      b.style.background = colorVar(p.game); b.style.color = inkVar(p.game);

    });
    body.appendChild(axis);

    var table = el("table");
    table.appendChild(el("thead", null, [el("tr", null, [el("th", { textContent: "Game" }), el("th", { textContent: "Time" }), el("th", { className: "n", textContent: "Active" })])]));
    var tb = el("tbody");
    ps.forEach(function (p) {
      var g = el("td", null, [swatch(p.game), p.game]);

      tb.appendChild(el("tr", null, [g, el("td", { textContent: A.clock(p.startMs, p.offsetMin) + "–" + A.clock(p.endMs, p.endOffsetMin) }),
                                     el("td", { className: "n", textContent: A.formatDuration(p.active_s) })]));
    });
    table.appendChild(tb);
    body.appendChild(table);
  }

  // ---- Year heatmap -------------------------------------------------------
  // Text alternative for the whole heatmap (cells are aria-hidden; the calendar and tables are the keyboard path).
  function heatSummary(year) {
    var yp = year + "-", total = 0, days = 0, best = "", bestS = 0;
    state.dayMap.forEach(function (e, k) {
      if (k.slice(0, 5) !== yp || e.total_s <= 0) return;
      total += e.total_s; days++;
      if (e.total_s > bestS) { bestS = e.total_s; best = k; }
    });
    return "Year " + year + " heatmap, one cell per day, weeks as columns. " + (days
      ? A.formatDuration(total) + " played on " + plural(days, "day") + "; busiest day " + fmtDay(best) + ", " + A.formatDuration(bestS) + "."
      : "No play recorded.");
  }

  function renderHeatmap() {
    var host = $("heat"), sc = host.parentNode, keepLeft = sc.scrollLeft; host.textContent = "";
    var year = +state.anchor.slice(0, 4), weeks = A.yearGrid(year);

    var root = svg("svg", { viewBox: "0 0 " + (LX + weeks.length * P) + " " + (TY + 7 * P), role: "img", "aria-label": heatSummary(year) });
    ["Mon", "Wed", "Fri"].forEach(function (d, i) { root.appendChild(svgText(0, TY + i * 2 * P + 9, d)); });

      });
      w.forEach(function (k, r) {

    lg.appendChild(document.createTextNode("More" + (state.maxDay ? " (busiest day this year: " + A.formatDuration(state.maxDay) + ")" : "")));
  }

  // ---- Per-game totals ----------------------------------------------------
  var TOTALS_CAP = 12;
  function renderTotals(rng) {
    $("totalsTitle").textContent = "Per game · " + periodLabel(state.range, rng);
    var host = $("totals"); host.textContent = "";
    var games = A.byGame(state.pieces, rng);

    var all = 0; games.forEach(function (g) { all += g.total_s; });

      var meta = plural(g.sessions, "session") + " · avg " + A.formatDuration(g.avg_session_s) + " · " + share + "% of total";
      var row = el("button", { type: "button", className: "grow" + (state.game && state.game !== g.game ? " dim" : "") }, [
        el("span", { className: "gname" }, [swatch(g.game), el("span", { className: "t", textContent: g.game + (g.source ? " (" + g.source + ")" : "") })]),
        el("span", { className: "gbar" }, [fill]),
        el("span", { className: "gval", textContent: A.formatDuration(g.total_s) }),
        el("span", { className: "gmeta", textContent: meta })]);
      row.setAttribute("data-game", g.game); row.setAttribute("aria-pressed", String(state.game === g.game));

  }

  // ---- Tooltip (one shared element; same content on hover and keyboard focus) ----
  var tip = $("tip");
  function showTip(t) {
    var s = t.getAttribute("data-tip");
    if (!s) return hideTip();
    tip.textContent = "";
    s.split("\n").forEach(function (ln, i) { tip.appendChild(el("div", { className: i ? "" : "tt", textContent: ln })); });
    tip.hidden = false;

  // ---- Interaction ----------------------------------------------------------
  function toggleDay(k) {

  }
  // Closing returns focus to the day cell that opened the panel (fallback: the Today button).
  function closeDay() {
    var k = state.selDay;
    state.selDay = null;
    rerender();
    var cells = $("month").querySelectorAll("[data-day]"), target = null;
    for (var i = 0; i < cells.length; i++) if (cells[i].getAttribute("data-day") === k) { target = cells[i]; break; }
    (target || $("today")).focus({ preventScroll: false });
  }
  function toggleGame(g) {
    state.game = state.game === g ? null : g;
    applyFilter();
    rerender();
  }
  $("app").addEventListener("click", function (e) {
    if (!state || !e.target.closest) return;
    var t = e.target.closest("[data-day],[data-game],#showAll");
    if (!t) return;
    hideTip();
    if (t.id === "showAll") { state.showAll = !state.showAll; rerender(); }
    else if (t.hasAttribute("data-day")) toggleDay(t.getAttribute("data-day"));
    else toggleGame(t.getAttribute("data-game"));
  });
  Array.prototype.forEach.call($("rangeSeg").querySelectorAll("button"), function (b) {
    b.onclick = function () { state.range = b.dataset.range; rerender(); };
  });
  $("prev").onclick = function () { shiftAnchor(-1); };
  $("next").onclick = function () { shiftAnchor(1); };
  $("today").onclick = function () { state.anchor = state.refDay; rerender(); };
  $("clearFilter").onclick = function () { state.game = null; applyFilter(); rerender(); };
  $("dayClose").onclick = closeDay;
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state && state.selDay) closeDay();
  });

  // ---- Self-test page ---------------------------------------------------
  function runSelftest() {
    $("app").style.display = "none";
    var box = $("selftest"); box.style.display = "block";
    var res = GT.selftest(), failed = 0;
    res.forEach(function (r) {
      if (!r.ok) failed++;
      var line = (r.ok ? "PASS " : "FAIL ") + r.name + (r.ok ? "" : " — " + r.msg);
      box.appendChild(el("div", { className: r.ok ? "pass" : "fail", textContent: line }));
      (r.ok ? console.log : console.error)(line);
    });
    var sum = (res.length - failed) + "/" + res.length + " passed";
    box.insertBefore(el("div", { className: failed ? "fail" : "pass", textContent: "Self-test: " + sum }), box.firstChild);
    console.log("Self-test: " + sum);
    document.title = (failed ? "FAIL" : "PASS") + " — GameTime self-test";
  }

  // ---- Wiring -------------------------------------------------------------
  $("loadbtn").onclick = function () { $("loader").classList.toggle("open"); };
  $("urlbtn").onclick = function () { var u = $("url").value.trim(); if (u) loadFromUrl(u, true); };
  $("url").onkeydown = function (e) { if (e.key === "Enter") $("urlbtn").onclick(); };
  $("pick").onclick = function () { $("file").click(); };
  $("file").onchange = function () { if (this.files[0]) loadFromFile(this.files[0]); this.value = ""; };
  function hasFiles(e) { return !!e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0; }
  ["dragenter", "dragover"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { if (!hasFiles(e)) return; e.preventDefault(); $("drop").classList.add("over"); $("loader").classList.add("open"); });
  });
  document.addEventListener("dragleave", function (e) { if (!e.relatedTarget) $("drop").classList.remove("over"); });
  document.addEventListener("drop", function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault(); $("drop").classList.remove("over");
    if (e.dataTransfer.files[0]) loadFromFile(e.dataTransfer.files[0]);
  });

  var qs = new URLSearchParams(location.search);
  var theme = qs.get("theme"); // debug / screenshots: ?theme=dark|light
  if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
  if (qs.get("selftest") === "1") runSelftest();
  else start();
})();
</script>
</body>
</html>
